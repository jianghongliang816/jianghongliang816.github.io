<!doctype html>
<html lang="zh-CN" class="reveal-enabled">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="精选品牌设计项目。" />
    <title>Brand｜设计作品集</title>
    <link rel="stylesheet" href="../styles.css?v=20260915-brand-sphere-stable5" />
    <script src="../site.js?v=20260915-brand-sphere-stable5" defer></script>
  </head>
  <body class="brand-page" id="top">
    <header class="site-header">
      <nav class="desktop-nav" aria-label="主导航">
        <a href="../index.html">WORK</a>
        <a class="is-current" href="index.html" aria-current="page">BRAND</a>
        <a href="../about/index.html">ABOUT</a>
      </nav>
    </header>

    <main class="brand-main">
      <h1 class="visually-hidden">Brand 品牌设计项目</h1>
      <section class="brand-intro" aria-label="乘愿而归品牌项目介绍">
        <figure class="brand-intro__panel project-media-item">
          <img src="../media/brand/intro/brand-intro-01.png" alt="乘愿而归军旅艺术礼品品牌的创作起点与品牌愿景" width="5692" height="2965" fetchpriority="high" decoding="async" />
        </figure>
        <section class="brand-scatter-story" data-brand-scatter-story aria-label="乘愿而归品牌内容成果与项目过程素材">
          <div class="brand-scatter-story__stage">
            <figure class="brand-scatter-story__frame brand-scatter-story__frame--intro">
              <img src="../media/brand/intro/brand-intro-02.png" alt="乘愿而归品牌内容、产品和商业成果介绍" width="5692" height="1258" decoding="async" />
            </figure>
            <figure class="brand-scatter-story__frame brand-scatter-story__frame--gallery">
              <div class="project-24-scatter" data-project-24-scatter role="group" aria-label="乘愿而归品牌项目过程与用户反馈素材散点画布"></div>
            </figure>
            <figure class="brand-scatter-story__frame brand-scatter-story__frame--video">
              <div class="brand-scatter-story__video-board">
                <img src="../media/brand/intro/brand-intro-03.png" alt="阿里巴巴项目组访谈视频与百万播放成果" width="5692" height="3229" decoding="async" />
                <div class="brand-video" data-brand-video>
                  <video playsinline preload="metadata" muted aria-label="阿里巴巴项目组访谈视频">
                    <source src="https://github.com/jianghongliang816/jianghongliang816.github.io/releases/download/original-media-2026-09-11/b47f466619a1-brand-interview.mp4" type="video/mp4" />
                  </video>
                  <button class="brand-video__start" type="button" data-brand-video-start aria-label="播放访谈视频">
                    <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M19 14 35 24 19 34Z" /></svg>
                  </button>
                  <div class="brand-video__controls" aria-label="视频播放控制">
                    <button class="brand-video__sound" type="button" data-brand-video-sound aria-label="打开视频声音" aria-pressed="false">
                      <svg class="brand-video__sound-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="m17 9 4 4m0-4-4 4"/></svg>
                      <svg class="brand-video__sound-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16 9.5a4 4 0 0 1 0 5M18.5 7a7 7 0 0 1 0 10"/></svg>
                    </button>
                    <input class="brand-video__progress" data-brand-video-progress type="range" min="0" max="1000" value="0" step="1" aria-label="视频播放进度" />
                  </div>
                </div>
              </div>
            </figure>
          </div>
        </section>
      </section>

      <section class="brand-projects shell" aria-label="品牌设计项目列表">
        <article class="project-card project-card--real" data-category="content">
          <a href="../work/project-13/index.html" aria-label="查看第13个项目">
            <div class="project-cover project-cover--project-13">
              <img class="project-cover__image" src="../media/project-13/images/home-cover.jpg?v=20260818-1" alt="身着迷彩服与战术手套的人双手展示乘愿而归礼盒" />
            </div>
          </a>
        </article>

        <figure class="brand-proof-card project-media-item">
          <img src="../media/brand/intro/brand-proof-card.png" alt="乘愿而归迷你被子豆腐块艺术礼盒的商品成果卡片" width="1306" height="502" loading="lazy" decoding="async" />
        </figure>

        <article class="project-card project-card--real" data-category="content">
          <a href="../work/project-15/index.html" aria-label="查看第15个项目">
            <div class="project-cover project-cover--project-15">
              <video class="project-cover__image" autoplay muted loop playsinline preload="metadata" aria-label="第15个项目动态视觉">
                <source src="https://github.com/jianghongliang816/jianghongliang816.github.io/releases/download/original-media-2026-09-11/65493646d57e-home-cover.mp4" type="video/mp4" />
              </video>
            </div>
          </a>
        </article>

        <article class="project-card project-card--real" data-category="content">
          <a href="../work/project-16/index.html" aria-label="查看第16个项目">
            <div class="project-cover project-cover--project-16">
              <img class="project-cover__image" src="../media/project-16/images/home-cover.png?v=20260821-1" alt="黑色软雕塑配件与粉色花朵陈列在木纹礼盒上" />
            </div>
          </a>
        </article>

        <article class="project-card project-card--real" data-category="brand product packaging content">
          <a href="../work/chengyuan-ergui/index.html" aria-label="查看乘愿而归项目">
            <div class="project-cover project-cover--chengyuan">
              <video class="project-cover__image" autoplay muted loop playsinline preload="metadata" poster="../media/chengyuan-ergui/posters/home-cover.jpg" aria-label="两只手围绕乘愿而归红色产品的动态视觉">
                <source src="https://github.com/jianghongliang816/jianghongliang816.github.io/releases/download/original-media-2026-09-11/2296167bc599-home-cover.mp4" type="video/mp4" />
              </video>
            </div>
          </a>
        </article>

        <article class="project-card project-card--real" data-category="content">
          <a href="../work/project-10/index.html" aria-label="查看5公里项目">
            <div class="project-cover project-cover--project-10">
              <img class="project-cover__image" src="../media/project-10/images/home-cover.png?v=20260817-1" alt="红色与金色纹理构成的海报视觉" />
            </div>
          </a>
        </article>
      </section>
    </main>

    <footer class="site-footer shell">
      <a href="#top">BACK TO TOP <span aria-hidden="true">↑</span></a>
      <div class="footer-grid">
        <p>Selected brand works<br />and ongoing practice.</p>
        <p>项目持续更新中</p>
        <p class="footer-year">© <span data-year></span></p>
      </div>
